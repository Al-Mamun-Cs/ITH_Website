<section class="brands-section py-1 bg-smokywhite text-center text-white">
  <div class="container" style="max-width: 1200px; padding-left: 15px; padding-right: 15px;">
    <h2 style="color: #0DAC50; font-size: 30px; margin-top: 15px; font-weight: bold;">Our Brands</h2>

    <div class="d-flex align-items-center justify-content-center" style="position: relative;">
      
      <button class="me-2" (click)="prev()"
        style="background-color: #11205F; z-index: 10; border: 3px solid #0DAC50; border-radius: 50px; height: 35px; width: 35px; cursor: pointer;">
        <i class="fas fa-chevron-left" style="color: #0DAC50;"></i>
      </button>

      <div style="overflow: hidden; width: 100%; margin: 0 10px;">
        
        <div class="d-flex" 
             [style.transform]="'translateX(-' + (activeIndex * (100 / visibleCount)) + '%)'"
             [style.transition]="isTransitioning ? 'transform 0.7s ease-in-out' : 'none'"
             style=" width: 100%;">

          <div *ngFor="let brand of duplicatedBrands" 
               [style.flex]="'0 0 ' + (100 / visibleCount) + '%'"
               style="max-width: 370px; padding: 10px;">

            <div style="
                width: 100%;
                height: 420px;
                background: #ffffff;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                border-top: 8px solid #0DAC50;
                padding: 20px;
                display: flex;
                flex-direction: column;">

              <div style="
                  width: 100%;
                  height: 280px;
                  background-color: #f8f9fa;
                  border-radius: 12px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  margin-bottom: 15px;
                  overflow: hidden;">

                <img [src]="getEmployeeImage(brand.brandImages)"
                     [alt]="brand.fullName"
                     style="max-width: 100%; max-height: 100%; object-fit: contain; min-height: 250px;"
                     (error)="$event.target.src = 'assets/no-image.png'">
              </div>

              <div style="text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <h6 style="color: #11205F; font-family: 'Times Ten', serif; font-weight: bold; font-size: 1.2rem; margin: 0;">
                  {{ brand.fullName }}
                </h6>
              </div>

            </div>
          </div>

        </div>
      </div>

      <button class="ms-2" (click)="next()"
        style="background-color: #11205F; z-index: 10; border: 3px solid #0DAC50; border-radius: 50px; height: 35px; width: 35px; cursor: pointer;">
        <i class="fas fa-chevron-right" style="color: #0DAC50;"></i>
      </button>
    </div>

    <div class="view" style="margin-top: 30px;">
      <a class="nav-link" routerLink="/brand" 
         style="font-size: 20px; font-weight: bold; transition: 0.3s; text-decoration: none;"
         [style.color]="linkColor" 
         (mouseover)="linkColor = '#0DAC50'" 
         (mouseleave)="linkColor = '#fff'">
         View All Brands 
      </a>
    </div>

  </div>
</section>
