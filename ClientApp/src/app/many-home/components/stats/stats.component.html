<section class="many-stats py-5 bg-smokywhite">
  <div class="container" style="max-width: 1155px; padding-left: 15px; padding-right: 15px;">
    <div class="row text-center align-items-center gy-4">
      <div class="col-6 col-md-3" *ngFor="let s of stats">
        <div class="stat-card p-3">
          <div class="stat-icon mb-2"><i [class]="s.icon + ' fa-2x'"></i></div>
          <div class="stat-value display-5 fw-bold">{{ s.value }}</div>
          <div class="stat-title display-7" style="color: black;">{{ s.title }}</div>
          <div class="stat-label small" style="color: #1E5BB8;">{{ s.label }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
