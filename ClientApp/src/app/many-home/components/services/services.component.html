<section class="many-services py-5 bg-white" style="font-family: 'Inter', 'Segoe UI', sans-serif;">
  <div class="container" style="max-width: 1200px;">
    
    <div style="text-align: center; margin-bottom: 60px;">
      <p style="color: #F57C00; font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px;">Modern Solutions</p>
      <h2 style="font-size: 32px; color: #1E5BB8; font-weight: 800; margin-bottom: 10px;">Our IT Services</h2>
      <div style="width: 60px; height: 4px; background: #F57C00; margin: 0 auto; border-radius: 2px;"></div>
    </div>

    <div class="row text-center gy-5 gx-4">
      <div class="col-6 col-md-4 col-lg-3" *ngFor="let s of services">

        <div style="position: relative; 
                    width: 100%; 
                    height: 150px; 
                    background: #E6F0FA; 
                    border-radius: 24px; 
                    box-shadow: 0 15px 35px rgba(17, 32, 95, 0.08); 
                    padding: 25px 15px; 
                    display: flex; 
                    flex-direction: column; 
                    align-items: center; 
                    justify-content: space-between;
                    transition: transform 0.3s ease;
                    border: 1px solid rgba(255,255,255,0.8);">

          <div [style.background]="s.color + '15'"
               style="position: absolute; 
                      top: -15px;
                      right: 0px; 
                      width: 65px; 
                      height: 65px; 
                      border-radius: 20px; 
                      display: flex; 
                      align-items: center; 
                      justify-content: center; 
                      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
                      backdrop-filter: blur(5px);
                      border: 2px solid #fff;">
            
            <img [src]="s.icon" 
                 [alt]="s.label"
                 style="width: 35px; height: 35px; object-fit: contain;"
                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/3524/3524659.png'">
          </div>

          <div style="margin-top: 40px; flex-grow: 1; display: flex; align-items: center; justify-content: center;">
            <h3 style="font-size: 20px; 
                       font-weight: 700; 
                       color: #1E5BB8; 
                       line-height: 1.4;
                       margin: 0;
                       padding: 0 5px;">
              {{ s.label }}
            </h3>
          </div>

          

          <div style="position: absolute; 
                      bottom: -5px; 
                      right: -5px; 
                      opacity: 0.03; 
                      pointer-events: none;
                      transform: rotate(-15deg);">
            <img [src]="s.icon" style="width: 90px;">
          </div>

          <div [style.background]="s.color" 
               style="position: absolute; left: 0; top: 25%; width: 4px; height: 50%; border-radius: 0 5px 5px 0;">
          </div>

        </div> </div>
    </div>
  </div>
</section>
