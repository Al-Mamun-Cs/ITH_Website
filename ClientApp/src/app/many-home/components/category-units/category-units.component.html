<section class="awards-section py-4 bg-white">
  <div class="container" style="max-width: 1200px; padding-left: 10px; padding-right: 10px;"
    *ngIf="duplicatedEvents.length > 0">

    <!-- TITLE -->
    <div class="col-12 mb-4">
      <h2 class="text-center" style="font-size: 30px; font-family: times ten; font-weight: bold; color: #1E5BB8;">
        Our Product
      </h2>
    </div>

    <!-- SLIDER -->
    <div class="d-flex align-items-center justify-content-center" style="position: relative;">

      <!-- LEFT BUTTON -->
      <!-- <button class="me-2" (click)="prev()"
        style="background-color: #f8f9fa; z-index: 10; border: 2px solid #11205F; border-radius: 50px; width: 35px; height: 35px; cursor: pointer;">
        <i class="fas fa-chevron-left" style="color: #FAAE1C;"></i>
      </button> -->

      <!-- VIEW AREA -->
      <div style="overflow: hidden; width: 100%; margin: 0 10px;">

        <!-- TRACK -->
        <div class="d-flex" [style.transform]="'translateX(-' + (activeIndex * (100 / visibleCount)) + '%)'"
          [style.transition]="isTransitioning ? 'transform 0.7s ease-in-out' : 'none'">

          <!-- ITEM -->
          <div *ngFor="let event of duplicatedEvents" [style.flex]="'0 0 ' + (100 / visibleCount) + '%'"
            style="padding: 15px;">

            <div
              style="width: 100%;height: 350px;background: #ffffff;border-radius: 20px;box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);border-top: 8px solid #1E5BB8;padding: 15px;display: flex;flex-direction: column; align-items: center;justify-content: center;">

              <!-- IMAGE -->
              <div
                style="width: 100%;height: 300px;display: flex; align-items: center;justify-content: center; overflow: hidden;">

                <img [src]="photoBaseUrl + event.categoryImages"
                  style="max-width: 100%; max-height: 100%; object-fit: cover; border-radius: 10px;"
                  onerror="this.src='assets/no-image.png'">
              </div>

              <!-- TITLE (NOW BELOW IMAGE) -->
              <!-- <div style="text-align: center; margin-top: 10px;">
                <p style="font-size: 15px; color: #11205F; margin: 0;">
                  {{ event.typeName }}
                </p>
              </div> -->
              <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">

                <button style="background-color: #1E5BB8;color: white;border: none;border-radius: 25px;padding: 8px;cursor: pointer;font-weight: 600;width: 150px;">
                  <i class="fas fa-phone"></i> Call Now
                </button>

                <button style="background-color: #F57C00; color: white;border: none;border-radius: 25px;padding: 8px;cursor: pointer; font-weight: 600;width: 150px;">
                  <i class="fas fa-rocket"></i> Try Free Demo
                </button>

              </div>



            </div>



          </div>

        </div>

      </div>

      <!-- RIGHT BUTTON -->
      <!-- <button class="ms-2" (click)="next()"
        style="background-color: #f8f9fa; z-index: 10; border: 2px solid #11205F; border-radius: 50px; width: 35px; height: 35px; cursor: pointer;">
        <i class="fas fa-chevron-right" style="color: #FAAE1C;"></i>
      </button> -->

    </div>

  </div>
</section>
