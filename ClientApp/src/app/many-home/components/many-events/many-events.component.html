<section class="awards-section py-4 bg-smokywhite">
  <div class="container" style="max-width: 1200px; padding-left: 10px; padding-right: 10px;"
    *ngIf="duplicatedEvents.length > 0">

    <!-- TITLE -->
    <div class="col-12 mb-4">
      <h2 class="text-center" style="font-size: 30px; font-family: times ten; font-weight: bold; color: #11205F;">
        Events
      </h2>
    </div>

    <!-- SLIDER -->
    <div class="d-flex align-items-center justify-content-center" style="position: relative;">

      <!-- LEFT BUTTON -->
      <button class="me-2" (click)="prev()"
        style="background-color: #f8f9fa; z-index: 10; border: 2px solid #11205F; border-radius: 50px; width: 35px; height: 35px; cursor: pointer;">
        <i class="fas fa-chevron-left" style="color: #FAAE1C;"></i>
      </button>

      <!-- VIEW AREA -->
      <div style="overflow: hidden; width: 100%; margin: 0 10px;">

        <!-- TRACK -->
        <div class="d-flex" [style.transform]="'translateX(-' + (activeIndex * (100 / visibleCount)) + '%)'"
          [style.transition]="isTransitioning ? 'transform 0.7s ease-in-out' : 'none'">

          <!-- ITEM -->
          <div *ngFor="let event of duplicatedEvents" [style.flex]="'0 0 ' + (100 / visibleCount) + '%'"
            style="padding: 15px;">

            <div style="width: 100%;height: 300px;background: #ffffff;border-radius: 20px;box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);border-top: 8px solid #11205F;padding: 15px;display: flex;flex-direction: column; align-items: center;justify-content: center;">

              <!-- IMAGE -->
              <div style="width: 100%;height: 220px;display: flex; align-items: center;justify-content: center; overflow: hidden;">

                <img [src]="photoBaseUrl + event.image"
                  style="max-width: 100%; max-height: 100%; object-fit: cover; border-radius: 10px;"
                  onerror="this.src='assets/no-image.png'">
              </div>

              <!-- TITLE (NOW BELOW IMAGE) -->
              <div style="text-align: center; margin-top: 10px;">
                <p style="font-size: 15px; color: #11205F; margin: 0;">
                  {{ event.name }}
                </p>
              </div>

            </div>



          </div>

        </div>

      </div>

      <!-- RIGHT BUTTON -->
      <button class="ms-2" (click)="next()"
        style="background-color: #f8f9fa; z-index: 10; border: 2px solid #11205F; border-radius: 50px; width: 35px; height: 35px; cursor: pointer;">
        <i class="fas fa-chevron-right" style="color: #FAAE1C;"></i>
      </button>

    </div>
    <div class="view" style="margin-top: 25px;" style="text-align: center;">
      <a class="nav-link" routerLink="/media/news" 
         style="font-size: 20px; font-weight: bold; transition: 0.3s; text-decoration: none;" 
         [style.color]="linkColor"         
         (mouseover)="linkColor = '#0DAC50'" 
         (mouseleave)="linkColor = '#11205F'">
         View Details 
      </a>
    </div>
  </div>
</section>
