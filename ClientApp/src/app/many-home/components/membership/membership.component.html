<section class="many-membership py-5 bg-white">
  <div class="container" style="max-width: 1155px; padding-left: 15px; padding-right: 15px;">
    <h2 style="text-align: center;font-size: 25px; margin-bottom: 25px; color: #0A509F;">
      Authorized Licenses & Registered
    </h2>
    <div class="row text-center align-items-center gy-4">
      <div class="col-6 col-md-4" *ngFor="let s of membership">
        <div class="stat-card p-3">
          <img [src]="s.title" alt="certificate"
               style="width: 200px; height: 200px; object-fit: contain;" />
        </div>
      </div>
    </div>
  </div>
</section>
