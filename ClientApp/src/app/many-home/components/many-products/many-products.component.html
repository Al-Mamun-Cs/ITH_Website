<section class="brands-section py-3 text-center" style="background-color: #0DAC50; color: black;">
  <div class="container" style="max-width: 1130px; padding-left: 10px; padding-right: 15px;">
    <h2 style="color: #11205F; font-size: 30px; margin-top: 10px;">Our Products</h2>

    <div class="d-flex align-items-center justify-content-center">

      <!-- LEFT BUTTON -->
      <button class="me-2" (click)="prev()"
        style="background-color: #0DAC50; z-index: 10; border: 3px solid #11205F; border-radius: 50px; height: 35px; width: 35px;">
        <i class="fas fa-chevron-left"></i>
      </button>

      <!-- SLIDER CONTAINER -->
      <div style="overflow: hidden; width: 100%;">

        <!-- SLIDER TRACK -->
        <div class="d-flex"
          [style.transform]="'translateX(-' + (activeIndex * (100 / visibleCount)) + '%)'"
          style="transition: transform 0.7s ease-in-out; width: 100%;">

          <!-- ITEMS -->
          <div class="col-12 col-md-4"
            *ngFor="let brand of productData"
            style="flex: 0 0 calc(100% / 3); max-width: 370px; padding: 0 10px;">

            <div style="
                width: 100%;
                height: 450px;
                background: #ffffff;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                border-top: 8px solid #11205F;
                padding: 20px;
                display: flex;
                flex-direction: column;">

              <!-- IMAGE -->
              <div style="
                  width: 100%;
                  height: 300px;
                  background-color: #f8f9fa;
                  border-radius: 12px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  margin-bottom: 15px;
                  overflow: hidden;">

                <img [src]="brand.productImages ? getEmployeeImage(brand.productImages) : 'assets/no-image.png'"
                  [alt]="brand.typeName"
                  style="max-width: 100%; max-height: 100%; object-fit: contain; min-height: 300px;"
                  (error)="updateDefaultImage($event)">
              </div>

              <!-- TEXT -->
              <div style="text-align: center; flex-grow: 1;">
                <h6 style="color: #666; font-size: 13px; margin: 0;">
                  {{ brand.category }} - {{ brand.subCategory }}
                </h6>

                <h6 style="color: #11205F; font-family: 'Times Ten', serif; font-weight: bold; font-size: 1.1rem; margin-top: 8px;">
                  {{ brand.typeName }}
                </h6>
              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- RIGHT BUTTON -->
      <button class="ms-2" (click)="next()"
        style="background-color: #0DAC50; z-index: 10; border: 3px solid #11205F; border-radius: 50px; height: 35px; width: 35px;">
        <i class="fas fa-chevron-right"></i>
      </button>

    </div>

  </div>
</section>
