<section class="clients-section">
  <div class="container" style="max-width: 1150px; padding-left: 15px; padding-right: 15px;">
    <h2 class="section-heading text-center mb-2" style="font-family: times ten;">Our Membership / Certification</h2>
    <p class="mb-5 text-center" style="color: #F57C00;font-weight: bold;">We are Certified member in ...</p>

    <div class="clients-carousel" *ngIf="clients.length > 0">
      
      <div class="row align-items-center justify-content-center">
        <div class="col-lg-12 text-center mb-4">
          <div class="logo-display-wrapper" style="max-width: 1150px; padding-left: 15px; padding-right: 15px;">
            <img [src]="clients[currentIndex].logo" 
                 [alt]="clients[currentIndex].name" 
                 class="img-fluid client-logo-large">
            
            <p class="client-name">{{ clients[currentIndex].name }}</p>
          </div>
        </div>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="carousel-controls d-flex gap-3 justify-content-center align-items-center">
            
            <button class="btn btn-sm" (click)="prevClient()">
              <i class="fas fa-chevron-left"></i>
            </button>
            
            <div class="logo-indicators d-flex gap-2 flex-wrap justify-content-center">
              <div class="logo-dot" 
                   *ngFor="let client of clients; let i = index" 
                   [class.active]="i === currentIndex"
                   (click)="currentIndex = i">
                <img [src]="client.logo" [alt]="client.name">
              </div>
            </div>

            <button class="btn btn-sm" (click)="nextClient()">
              <i class="fas fa-chevron-right"></i>
            </button>
            
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
