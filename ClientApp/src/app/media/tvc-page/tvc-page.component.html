<!-- Page Header -->
<div class="page-header">
  <div class="overlay">
    <div class="container h-100 d-flex flex-column justify-content-center align-items-center text-center">
      <p class="hero-subtitle">RECOGNITION</p>
      <h1 class="hero-title" style="color: #F57C00;">TVC & AV</h1>
    </div>
  </div>
</div>

<!-- Content -->
<section class="py-5">
  <div class="container" style="max-width: 1120px; padding-left: 5px; padding-right: 15px;">
    <div class="row">
      <div class="col-lg-6 col-md-6 col-sm-12 mb-4" *ngFor="let brand of dataSource.data; let i = index">

        <div
          style="position: relative; width: 100%; background: #000; border-radius: 4px; overflow: hidden; aspect-ratio: 16/9;border: 1px solid #F57C00;border-radius: 15px;">
          <div
            style="position: absolute; top: 0; left: 0; width: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; z-index: 10;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="font-size: 15px; font-weight: 500; text-shadow: 1px 1px 2px #000;">{{ brand.name }}</span>
            </div>

            <div style="display: flex; gap: 15px;">
              <div style="text-align: center; cursor: pointer;">
                <i class="far fa-clock" style="font-size: 20px; display: block;"></i>
                <span style="font-size: 12px;">Watch later</span>
              </div>

              <div style="position: relative; text-align: center;">
                <div (click)="toggleShareMenu(brand)" style="cursor: pointer;">
                  <i class="fas fa-share" style="font-size: 20px; display: block;"></i>
                  <span style="font-size: 12px;">Share</span>
                </div>
                <div *ngIf="brand.showShareMenu"
                  style="position: absolute; top: 45px; right: 0; background: rgba(28,28,28,0.95); border: 1px solid #444; border-radius: 4px; padding: 10px; z-index: 100; min-width: 120px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                  <div (click)="shareToFacebook(brand)"
                    style="color: #fff; font-size: 13px; padding: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fab fa-facebook" style="color: #1E5BB8;"></i> Facebook
                  </div>
                  <div (click)="shareToTwitter(brand)"
                    style="color: #fff; font-size: 13px; padding: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fab fa-twitter" style="color: #1E5BB8;"></i> Twitter
                  </div>
                </div>
              </div>
            </div>
          </div>


          <video [id]="'video_' + i" *ngIf="brand.videoDoc" [src]="getEmployeeImage(brand.videoDoc)"
            (play)="brand.isPlaying = true" (pause)="brand.isPlaying = false"
            style="width: 100%; height: 100%; display: block; object-fit: contain;" [controls]="brand.isPlaying">
          </video>

          <div *ngIf="!brand.isPlaying" (click)="forcePlayVideo('video_' + i, brand)"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; cursor: pointer;">

            <svg height="60" viewBox="0 0 68 48" width="60">
              <path
                d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z"
                fill="#f00"></path>
              <path d="M 45,24 27,14 27,34" fill="#fff"></path>
            </svg>
          </div>

          <div *ngIf="!brand.isPlaying" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 45px; background: rgba(0,0,0,0.7); display: flex; align-items: center; padding: 0 15px; z-index: 110;">
            <a [href]="brand.youtubeUrl || 'https://www.youtube.com'" target="_blank" 
               style="display: flex; align-items: center; text-decoration: none; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px;">
              
              <span style="color: #fff; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; margin-right: 12px;">
                Watch on
              </span>

              <div style="display: flex; align-items: center; gap: 6px; background: #181818; padding: 6px 14px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.1);">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube" style="height: 20px;" />
              </div>
            </a>
          </div>

        </div>
      </div>
    </div>
    <div class="d-flex justify-content-center mt-4">
      <mat-paginator [length]="paging.length" [showFirstLastButtons]="masterData.paging.showFirstLastButtons"
        [pageSize]="paging.pageSize" [pageSizeOptions]="masterData.paging.pageSizeOptions" (page)="pageChanged($event)">
      </mat-paginator>
    </div>
  </div>
</section>
