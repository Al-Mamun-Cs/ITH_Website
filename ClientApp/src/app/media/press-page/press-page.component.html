<!-- Page Header -->
<div class="page-header">
  <div class="overlay">
    <div class="container h-100 d-flex flex-column justify-content-center align-items-center text-center">
      <p class="hero-subtitle">RECOGNITION</p>
      <h1 class="hero-title" style="color: #F57C00;">Press</h1>
    </div>
  </div>
</div>

<!-- Content -->
<section class="py-5">
  <div class="container" style="max-width: 1120px; padding-left: 5px; padding-right: 15px;">
    <div class="row">
      <div class="col-lg-6 col-md-6 col-sm-12 mb-4" *ngFor="let brand of dataSource.data">
        <div style="background: #fff;text-align: center;">
          <img [src]="getEmployeeImage(brand.image)"
            style="width:100%; height:250px;" />
          <!-- <h6 style="margin-top: 10px; font-size: large;">{{ brand.name }}</h6> -->
          
        </div>
        <!-- <h1 style="margin-top: 10px; font-size: small;">{{ brand.descriptions }}</h1> -->
      </div>
    </div>
    <div class="d-flex justify-content-center mt-4">
      <mat-paginator [length]="paging.length" [showFirstLastButtons]="masterData.paging.showFirstLastButtons"
        [pageSize]="paging.pageSize" [pageSizeOptions]="masterData.paging.pageSizeOptions" (page)="pageChanged($event)">
      </mat-paginator>
    </div>
  </div>
</section>
