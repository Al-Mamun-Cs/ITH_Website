<section class="py-5">
	<div class="container" style="max-width: 1120px; padding-left: 5px; padding-right: 15px;">
		<div class="row">
			<div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let brand of dataSource.data">
				<div
					style="display: inline-block; width: 100%; height: 320px; background: #ffffff; border-radius: 20px; 
    					overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); border-top: 8px solid #1E5BB8; padding: 30px; position: relative;">

					<div
						style="display: flex; justify-content: center; align-items: center; height: 180px; margin-bottom: 0px;">
						<img [src]="brand.clientsImage ? getEmployeeImage(brand.clientsImage) : 'assets/images/default-logo.jpg'"
							[alt]="brand.supplierName" (error)="$event.target.src = 'assets/images/default-logo.jpg'"
							[style.padding]="!brand.clientsImage ? '40px' : '0px'"
							style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);"
							onerror="this.src='assets/no-image.png'">
					</div>

					<div
						style="margin-top: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
						<h6
							style="color: #0D3E91; font-family: 'Times Ten', serif; text-align: center; font-weight: bold; font-size: 1.2rem; margin: 0;">
							{{ brand.supplierName }}
						</h6>
					</div>

				</div>
			</div>
		</div>
	</div>
</section>
