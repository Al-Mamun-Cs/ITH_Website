<section class="py-5">
  <div class="container" style="max-width: 1120px; padding-left: 5px; padding-right: 15px;">
    <div class="row d-flex">

      <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let brand of awards; trackBy: trackById">
        <div style="width: 100%; height: 420px; background: #ffffff; border-radius: 20px;
                overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
                border-top: 8px solid #11205F; padding: 30px;">

          <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <img [src]="getFullImageUrl(brand.image)"
              style="width: 100%; max-width: 320px; height: 300px; object-fit: cover;"
              onerror="this.src='assets/no-image.png'">
          </div>

          <h6 style="text-align:center;font-size: 15px; color:#11205F;">
            {{ brand.name }}
          </h6>

        </div>

      </div>

    </div>


  </div>
</section>
